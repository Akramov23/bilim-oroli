<!doctype html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Bilim Oroli</title>
  <meta name="description" content="Bolalar uchun 3D o'quv o'yini: matematika, ingliz va nemis tili, mantiq, kartalar va do'stlar bilan o'yin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="loading" class="loading"><div class="logo bounce">🏝️</div><div class="dots3"><i></i><i></i><i></i></div></div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="player-card">
        <div class="lvl-badge" id="lvlBadge">1</div>
        <div class="pinfo">
          <div class="pname" id="pName"></div>
          <div class="xpbar"><div id="xpFill"></div><span id="xpText"></span></div>
        </div>
      </div>
      <div class="coin-pill" id="coinPill"><span class="coin-ic">🪙</span><span id="coinCount">0</span></div>
    </div>

    <canvas id="minimap" class="minimap" width="300" height="300"></canvas>
    <nav class="hud-menu">
      <button data-open="cards"><span>🃏</span><small data-i18n="cards"></small></button>
      <button data-open="shop"><span>🛍️</span><small data-i18n="shop"></small></button>
      <button data-open="wardrobe"><span>👕</span><small data-i18n="wardrobe"></small></button>
      <button data-open="friends"><span>👫</span><small data-i18n="friends"></small></button>
      <button data-open="settings"><span>⚙️</span><small data-i18n="settings"></small></button>
    </nav>

    <button id="enterBtn" class="enter-btn hidden"></button>
    <div id="hint" class="hint"></div>
    <div id="huntBar" class="hunt-bar hidden"></div>
    <div id="emoteBar" class="emote-bar"></div>
    <div id="joystick" class="joystick"><div class="knob"></div></div>
    <button id="jumpBtn" class="jump-btn">⬆</button>
  </div>

  <div id="onboard" class="screen"></div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="close-btn" aria-label="Close">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="confetti"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
